[project]
name = "ComfyUI-LTXVideo"
version = "1.1.0"
description = "Custom nodes for LTX-Video support in ComfyUI"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "colour-science>=0.4.4",
    "diffusers",
    "einops",
    "huggingface_hub>=0.25.2",
    "kornia",
    "ninja~=1.11.1.4",
    "openimageio",
    "transformers>=4.50.0",
]

[project.urls]
Repository = "https://github.com/Lightricks/ComfyUI-LTXVideo"

[tool.comfy]
PublisherId = "ltx-io"
DisplayName = "ComfyUI-LTXVideo"
requires-comfyui = ">=0.35.0"
